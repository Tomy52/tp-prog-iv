<td>{{ log().revisionId }}</td>
<td>{{ log().revisionDate | date:'dd/MM/yyyy HH:mm' }}</td>
<td>{{ log().userId ? log().userId : 'Sistema' }}</td>
<td>{{ this.prettifyCategory(log().category) }}</td>
<td>
            <span [attr.data-type]="log().revisionType" class="badge"
                  [class.badge-add]="log().revisionType === 0"
                  [class.badge-update]="log().revisionType === 1"
                  [class.badge-delete]="log().revisionType === 2">
              {{ log().revisionType === 0 ? 'ALTA' : log().revisionType === 1 ? 'MODIFICACIÓN' : 'BAJA' }}
            </span>
</td>
<td>
  <button type="button" disabled title="en construcción">
    Ver
  </button>
</td>
