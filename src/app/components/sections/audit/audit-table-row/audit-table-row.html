<td class="hide-on-mobile">{{ log().revisionId }}</td>
<td class="hide-on-mobile">{{ log().revisionDate | date:'dd/MM/yyyy HH:mm' }}</td>
<td><a [routerLink]="['/users', log().userId]" title="Ver usuario relacionado">{{ log().userId ? log().userId : 'Sistema' }}</a></td>
<td>{{ this.prettifyCategory(log().category) }}</td>
<td>
            <span [attr.data-type]="log().revisionType" class="badge"
                  [class.badge-active]="log().revisionType === 0"
                  [class.badge-update]="log().revisionType === 1"
                  [class.badge-inactive]="log().revisionType === 2">
              {{ log().revisionType === 0 ? 'ALTA' : log().revisionType === 1 ? 'MODIFICACIÓN' : 'BAJA' }}
            </span>
</td>
<td>
  <button type="button" [routerLink]="['/audit', log().category, log().revisionId]" title="Ver detalles del movimiento">
    Ver
  </button>
</td>
