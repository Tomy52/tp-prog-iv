<header>
  <span class="page-title">Proveedores</span>
  <span class="page-subtitle">Eliminar proveedor</span>
</header>

<section>
  <form action="" [formGroup]="form" (ngSubmit)="submit()">

    <label for="suppliers">Proveedor</label>
    <app-supplier-dropdown-select id="suppliers" [suppliers]="suppliers()" formControlName="id"/>
    <input type="submit" value="Eliminar" [disabled]="!isValid()">

  </form>
</section>
