<header>
  <span class="page-title">Categorías</span>
  <span class="page-subtitle" [textContent]="'Agregar categoría'"></span>
</header>

<section>
    <article>
        <form action="" [formGroup]="form" (ngSubmit)="completeForm()">
            <h2 ></h2>
            <div>
                <label for="name">Nombre</label>
                <input type="text" placeholder="Ej.: SinTACC" name="name" id="name" formControlName="name" [appFieldErrorBorder]="form.get('name')">
            </div>
            <small class="error-msg" [appFieldError]="form.get('name')"></small>
            <input type="submit" value="Subir" [disabled]="!isValid()">
        </form>
    </article>
</section>
