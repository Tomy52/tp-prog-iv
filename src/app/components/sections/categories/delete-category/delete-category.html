<header>
  <span class="page-title">Categorías</span>
  <span class="page-subtitle">Eliminar categoría</span>
</header>

<section>
    <article>
        <form action="" [formGroup]="form" (ngSubmit)="completeForm()">
            <app-category-dropdown-select formControlName="category" [categories]="categories()"/>
            <input type="submit" value="Eliminar" [disabled]="!isValid()">
        </form>
    </article>
</section>
