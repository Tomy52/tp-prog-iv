<div class="dashboard-layout">

  <main class="dashboard-columns">

    <div class="carousel-wrapper">
      <section class="premium-carousel">
        <div class="carousel-track">
          
          <div class="carousel-slide" [class.active]="currentSlide === 0">
            <img src="images/compraYRetiro.png" alt="compra y retiro" class="carousel-img">
            <div class="slide-overlay"></div>
            <div class="slide-content">
              <h2>Hace tu pedido</h2>
              <p>¡Retiro sin costo ni demora!</p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="right-column">
      
      <aside class="premium-aside-panel">
        
        <div class="aside-left-content">
          <div class="aside-card-header">
            <h3>Mi Espacio</h3>
            <span class="gold-divider"></span>
          </div>
          <div class="welcome-client-card">
            <p class="welcome-text">¡Hola de nuevo!</p>
            <p class="client-status">Cliente Exclusivo</p>
          </div>
        </div>

        <div class="aside-right-content">
          <div class="info-stat-block">
            <div class="stat-icon">✨</div>
            <div class="stat-data">
              <span class="stat-label">Horarios</span>
              <span class="stat-value">Lunes a Sábados</span>
              <span class="stat-value">9:00 a 21:00</span>
            </div>
          </div>
          
          <div class="info-stat-block">
            <div class="stat-icon">🚚</div>
            <div class="stat-data">
              <span class="stat-label">Envíos</span>
              <span class="stat-value">Entregas en</span>
              <span class="stat-value">24-48 horas</span>
            </div>
          </div>
        </div>

      </aside>

      <div class="menu-form-card">
        <div class="menu-container">
          
          <div class="btn-productos">
            <app-main-menu-button router_link="on-sale" texto="Productos en venta">
            </app-main-menu-button>
          </div>
          
          <div class="btn-pedidos">
            <app-main-menu-button router_link="all-orders" texto="Todos los pedidos"></app-main-menu-button>
          </div>

        </div>
      </div>

    </div> 
  </main>

</div>
